<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profit Readiness Scorecard | Cambridge Advantage</title>
<meta name="description" content="Evaluate your business across 6 core growth levers to identify exact leaks in your pipeline, margins, and sales conversions.">
<link rel="icon" type="image/png" sizes="64x64" href="./assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0d0d0d;
  --navy-mid:#181818;
  --navy-card:#222222;
  --gold:#E8501A;
  --gold-light:#F07840;
  --muted:#888888;
  --border:rgba(232,80,26,0.22);
  --border-soft:rgba(255,255,255,0.07);
}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--navy);color:#e8e4dc;overflow-x:hidden}

/* ── NAV ── */
nav{
  display:flex;justify-space-between;align-items:center;
  padding:1.3rem 4rem;
  border-bottom:1px solid var(--border);
  position:sticky;top:0;
  background:rgba(13,13,13,0.97);
  backdrop-filter:blur(12px);
  z-index:200;
}
.logo-link{display:flex;align-items:center;text-decoration:none}
.logo-img{height:100px;width:auto;display:block}
.nav-links{list-style:none;display:flex;gap:clamp(.75rem,1.55vw,2rem);align-items:center}
.nav-links a{text-decoration:none;color:var(--muted);font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;transition:color .2s}
.nav-links a:hover{color:var(--gold)}
.nav-cta{background:var(--gold)!important;color:var(--navy)!important;padding:.5rem 1.2rem;border-radius:2px;font-weight:500!important;transition:background .2s!important}
.nav-cta:hover{background:var(--gold-light)!important;color:var(--navy)!important}
.nav-toggle{display:none;flex-direction:column;justify-content:center;gap:5px;width:42px;height:42px;background:none;border:1px solid var(--border);border-radius:3px;cursor:pointer;padding:0 9px}
.nav-toggle span{display:block;height:2px;width:100%;background:#e8e4dc;border-radius:2px;transition:transform .3s,opacity .3s}
.nav-toggle.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.nav-toggle.open span:nth-child(2){opacity:0}
.nav-toggle.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

/* ── SHARED ── */
.eyebrow{font-size:.95rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:1.4rem;display:flex;align-items:center;gap:.8rem}
.eyebrow::before{content:'';display:block;width:28px;height:1px;background:var(--gold)}
h2{font-family:'Cormorant Garamond',serif;font-size:2.6rem;font-weight:300;color:#fff;line-height:1.25}
.btn-primary{background:var(--gold);color:var(--navy);padding:.85rem 1.8rem;border:none;border-radius:2px;font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:500;letter-spacing:.07em;cursor:pointer;text-transform:uppercase;transition:background .2s;display:inline-block;text-decoration:none}
.btn-primary:hover{background:var(--gold-light)}
.btn-outline{background:transparent;color:#e8e4dc;padding:.85rem 1.8rem;border:1px solid var(--border);border-radius:2px;font-family:'DM Sans',sans-serif;font-size:.82rem;letter-spacing:.07em;cursor:pointer;text-transform:uppercase;transition:border-color .2s,color .2s;display:inline-block;text-decoration:none}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}
.btn-row{display:flex;gap:.9rem;flex-wrap:wrap;align-items:center}

/* ── HERO HEADER ── */
#services-header{max-width:1100px;margin:0 auto;padding:6rem 4rem 5rem}
h1{font-family:'Cormorant Garamond',serif;font-size:3rem;font-weight:300;line-height:1.1;color:#fff;margin-bottom:1.6rem;max-width:700px}
h1 em{font-style:italic;color:var(--gold)}
.hero-desc{font-size:1rem;line-height:1.85;color:var(--muted);margin-bottom:2.2rem;max-width:640px}
.hero-meta{font-size:.78rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-top:1.2rem}

/* ── AUDIT SECTION ── */
#audit-section{background:#2f2f2f;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.section-inner{max-width:1100px;margin:0 auto;padding:5rem 4rem}

.instructions{
  background:var(--navy-card);
  border:1px solid var(--border);
  border-left:3px solid var(--gold);
  border-radius:4px;
  padding:1.5rem 1.8rem;
  margin-bottom:2.5rem;
  font-size:.9rem;
  color:var(--muted);
  line-height:1.7;
}
.instructions strong{color:#fff;font-weight:500}

/* ON-SCREEN ERROR BANNER */
.error-banner {
  display: none;
  background: rgba(232, 80, 26, 0.12);
  border: 1px solid var(--gold);
  border-left: 4px solid var(--gold);
  color: #fff;
  padding: 1rem 1.5rem;
  border-radius: 4px;
  margin-bottom: 1.5rem;
  font-size: .88rem;
  font-weight: 500;
  align-items: center;
  gap: .8rem;
  animation: fadeIn 0.3s ease-in-out;
}
.error-banner.show { display: flex; }
.error-icon {
  background: var(--gold);
  color: var(--navy);
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: .8rem;
  flex-shrink: 0;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Progress Tracker */
.progress-wrap{margin-bottom:2rem}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.6rem}
.progress-label{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:500}
.progress-count{font-size:.78rem;color:var(--muted)}
.progress-track{height:4px;background:var(--navy-card);border-radius:2px;overflow:hidden;border:1px solid var(--border-soft)}
.progress-bar{height:100%;background:var(--gold);width:0%;transition:width .4s ease}

/* Question Steps */
.lever-step{display:none}
.lever-step.active{display:block}

.lever-card{background:var(--navy-card);border:1px solid var(--border);border-radius:4px;overflow:hidden;margin-bottom:2rem}
.lever-head{padding:2rem;border-bottom:1px solid var(--border);display:grid;grid-template-columns:auto 1fr auto;gap:1.5rem;align-items:center}
.lever-n{font-family:'Cormorant Garamond',serif;font-size:3rem;font-weight:300;color:var(--gold);line-height:1}
.lever-kicker{font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin-bottom:.3rem}
.lever-name{font-family:'Cormorant Garamond',serif;font-size:1.8rem;color:#fff;font-weight:300}
.lever-tag{font-size:.85rem;color:var(--muted);margin-top:.2rem;line-height:1.5}
.lever-pts{font-size:.7rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}

.q-col-head{display:grid;grid-template-columns:30px 1fr 220px;padding:.8rem 2rem;gap:1rem;background:rgba(13,13,13,0.4);border-bottom:1px solid var(--border-soft)}
.q-col-label{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.q-col-label.right{text-align:right}

.q-row{display:grid;grid-template-columns:30px 1fr 220px;align-items:center;gap:1rem;padding:1.4rem 2rem;border-bottom:1px solid var(--border-soft);transition:background 0.2s}
.q-row.unanswered{background:rgba(232,80,26,0.12); border-left: 2px solid var(--gold);}
.q-row:last-of-type{border-bottom:none}
.q-n{font-family:'Cormorant Garamond',serif;font-size:1.2rem;color:var(--gold)}
.q-text{font-size:.88rem;color:#e8e4dc;line-height:1.6}

.radio-scale{display:flex;justify-content:flex-end;gap:.5rem}
.r-opt{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.r-opt input{display:none}
.r-circle{
  width:32px;height:32px;border-radius:2px;border:1px solid var(--border);
  background:var(--navy);display:flex;align-items:center;justify-content:center;
  font-size:.78rem;color:var(--muted);transition:all .2s;
}
.r-opt input:checked + .r-circle{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700}
.r-opt:hover .r-circle{border-color:var(--gold);color:var(--gold-light)}

.step-nav{display:flex;justify-content:space-between;gap:1rem;margin-top:2rem}

/* ── MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);z-index:1000;align-items:center;justify-content:center;padding:1.5rem}
.modal-overlay.show{display:flex}
.modal-box{background:#1a1a1a;border:1px solid var(--border);border-radius:4px;max-width:580px;width:100%;max-height:90vh;overflow-y:auto;padding:2rem;position:relative}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;color:#fff;margin-bottom:.4rem;line-height:1
